<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="실제 장소를 검색하고 두 지점 사이의 자동차 도로 거리를 확인해 보세요."
    />
    <meta name="theme-color" content="#f5f7f3" />
    <title>길이음 — 두 장소 사이의 거리</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='13' fill='%231c7355'/%3E%3Cpath d='M12 27 27 12M14 13h13v13' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="길이음 홈">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 19 19 5M8 5h11v11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span>길이음</span>
      </a>
      <span class="topbar-note"><span class="live-dot"></span> OpenStreetMap 기반</span>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span class="eyebrow-line"></span> apimap</p>
        <h1 id="page-title">두 장소 사이,<br /><span>얼마나 멀까요?</span></h1>
        <p class="intro-copy">
          출발지와 도착지를 검색해 보세요.<br class="desktop-break" />
          실제 자동차 도로를 따라 거리를 알려드릴게요.
        </p>
      </section>

      <section class="route-card" aria-label="거리 계산">
        <div class="form-column">
          <div class="field-stack">
            <div class="location-field">
              <span class="location-marker start-marker" aria-hidden="true"></span>
              <label class="field-content">
                <span class="field-label">출발지</span>
                <input
                  id="start-input"
                  type="text"
                  placeholder="예: 서울역"
                  autocomplete="off"
                  aria-label="출발지 검색"
                  aria-controls="start-results"
                  aria-expanded="false"
                />
              </label>
              <button class="clear-button" type="button" aria-label="출발지 지우기" hidden>×</button>
              <ul class="suggestions" id="start-results" role="listbox" aria-label="출발지 검색 결과" hidden></ul>
            </div>

            <div class="field-connector" aria-hidden="true"></div>

            <div class="location-field">
              <span class="location-marker end-marker" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none"><path d="M8 14s5-4.1 5-8a5 5 0 1 0-10 0c0 3.9 5 8 5 8Z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="6" r="1.7" fill="currentColor"/></svg>
              </span>
              <label class="field-content">
                <span class="field-label">도착지</span>
                <input
                  id="end-input"
                  type="text"
                  placeholder="예: 부산역"
                  autocomplete="off"
                  aria-label="도착지 검색"
                  aria-controls="end-results"
                  aria-expanded="false"
                />
              </label>
              <button class="clear-button" type="button" aria-label="도착지 지우기" hidden>×</button>
              <ul class="suggestions" id="end-results" role="listbox" aria-label="도착지 검색 결과" hidden></ul>
            </div>
          </div>

          <p class="form-hint" id="form-hint" aria-live="polite">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.3v3.4M8 5.2v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            검색 결과에서 장소를 선택해 주세요.
          </p>

          <button class="calculate-button" id="calculate-button" type="button" disabled>
            <span>거리 계산하기</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="result-panel" id="result-panel" aria-live="polite" aria-atomic="true">
          <div class="result-empty" id="result-empty">
            <span class="route-art" aria-hidden="true">
              <svg viewBox="0 0 212 112" fill="none">
                <path d="M27 81c21 0 22-49 48-49s23 46 48 46 27-44 62-44" stroke="#B8CDBE" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>
                <circle cx="27" cy="81" r="8" fill="#E5F0E9"/><circle cx="27" cy="81" r="3" fill="#1C7355"/>
                <circle cx="185" cy="34" r="8" fill="#F8E9E1"/><path d="M185 29.5a3 3 0 0 0-3 3c0 2.3 3 4.8 3 4.8s3-2.5 3-4.8a3 3 0 0 0-3-3Z" stroke="#C56B4E" stroke-width="1.3"/><circle cx="185" cy="32.4" r=".9" fill="#C56B4E"/>
                <path d="m105 48 3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1 3.4-6.9Z" fill="#DDE9D7"/>
              </svg>
            </span>
            <p class="empty-title">여정의 시작을 기다리고 있어요</p>
            <p class="empty-copy">두 장소를 선택하면<br />도로 거리를 계산해 드려요.</p>
          </div>
          <div class="result-content" id="result-content" hidden>
            <span class="result-kicker"><span class="live-dot"></span> 자동차 도로 거리</span>
            <p class="distance-value" id="distance-value"></p>
            <p class="route-summary" id="route-summary"></p>
            <div class="result-divider"></div>
            <a class="map-link" id="map-link" href="#" target="_blank" rel="noopener noreferrer">
              <span class="map-link-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none"><path d="m3 5 4-2 6 2 4-2v12l-4 2-6-2-4 2V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 3v12m6-10v12" stroke="currentColor" stroke-width="1.5"/></svg>
              </span>
              <span>지도에서 보기</span>
              <svg class="external-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.5 3.5h6v6m-.5-5.5L6 10m-1.5-5h-1A1.5 1.5 0 0 0 2 6.5v6A1.5 1.5 0 0 0 3.5 14h6a1.5 1.5 0 0 0 1.5-1.5v-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </div>
        </div>
      </section>

      <p class="page-footnote">
        장소 검색: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap 기여자</a>
        <span aria-hidden="true">·</span> 경로 안내: OSRM
      </p>
    </main>
  </body>
</html>
